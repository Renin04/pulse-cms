<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="output"></div>
<textarea id="user-code" style="display:none">console.log(&quot;hello&quot;)</textarea>
<script>
(function() {
  const output = document.getElementById('output');
  function addEntry(type, args) {
    const msg = Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
    const div = document.createElement('div');
    div.className = 'entry ' + type;
    div.textContent = msg;
    output.appendChild(div);
  }
  const origLog = console.log;
  console.log = function(...args) { addEntry('log', args); origLog.apply(console, args); };
  const code = document.getElementById('user-code').value;
  console.log('Code value:', JSON.stringify(code));
  try { new Function(code)(); } catch(e) { addEntry('error', [e.name + ': ' + e.message]); }
})();
</script>
</body>
</html>
